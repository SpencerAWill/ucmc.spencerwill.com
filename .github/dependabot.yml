# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# `cooldown` mirrors `minimumReleaseAge: 10080` (7 days) in
# pnpm-workspace.yaml: pnpm refuses to install any version published in
# the last week (publish-compromise defense), so Dependabot must not open
# PRs for versions younger than that — the lockfile update would fail.
version: 2
updates:
  # ── npm (whole pnpm workspace: root + apps/ucmc-web + infra via the root lock)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      # 7 days = the `minimumReleaseAge` quarantine floor (pnpm won't
      # install anything younger). Majors soak 30 days for stability;
      # minor/patch fall back to `default-days`.
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    ignore:
      # Node's types follow the Node we run (`.nvmrc`, CI, the devcontainer
      # feature), not the newest Node. A major here types APIs the runtime
      # doesn't have, and drifted once to ^26 against Node 24 (#317). Raise
      # it by hand in the change that moves `.nvmrc`.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Framework families — keep majors visible by batching per-family.
      tanstack:
        patterns: ["@tanstack/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      # Vitest rides with the Cloudflare family: `@cloudflare/vitest-plugin`
      # peers on a Vitest range, and the `@vitest/*` companions peer on the
      # exact Vitest version, so bumping any of them alone fails install.
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - "wrangler"
          - "miniflare"
          - "workerd"
          - "vitest"
          - "@vitest/*"
      # `@pulumi/cloudflare` is excluded here AND from both catch-alls below,
      # so it always gets a PR of its own. `.claude/rules/infra.md`: 6.21.0
      # planned a replacement of the dev D1 database, so a provider bump is
      # reviewed alone against its `pulumi preview`, never inside a group.
      pulumi:
        patterns: ["@pulumi/*", "pulumi"]
        exclude-patterns: ["@pulumi/cloudflare"]
      linting:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
          - "prettier-*"
          - "@commitlint/*"
          - "commitlint"
          - "lint-staged"
          - "czg"
          - "husky"
      # Catch-alls: batch all remaining minor/patch bumps into one PR per
      # dependency type. Majors fall through to individual PRs for review.
      production-minor:
        dependency-type: "production"
        update-types: ["minor", "patch"]
        exclude-patterns: ["@pulumi/cloudflare"]
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
        exclude-patterns: ["@pulumi/cloudflare"]

  # ── GitHub Actions (guards against action tag-hijack; same cooldown)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # semver-*-days are only valid for semver ecosystems (npm); actions
    # uses non-semver tags, so only default-days applies here.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]

  # ── Devcontainer features (node, github-cli) and their lockfile,
  #    `.devcontainer/devcontainer-lock.json`
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      devcontainers:
        patterns: ["*"]

  # ── Compose sidecars (Mailpit). Its pin is duplicated as the CI service
  #    image in ci.yml, which no ecosystem reads — update both together.
  - package-ecosystem: "docker-compose"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      docker-compose:
        patterns: ["*"]

  # ── Devcontainer base image
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    # semver-*-days unsupported for docker image tags; default-days only.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      docker:
        patterns: ["*"]
