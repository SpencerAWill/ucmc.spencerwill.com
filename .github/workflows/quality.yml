name: Quality

# Periodic, not per-PR. Everything in this workflow is a REPORT that
# informs what to write next, not a gate that blocks a merge — and each
# job costs several times what it would save by running on every push.
#
# `ci.yml` stays the fast per-PR gate; this is where the slow, advisory
# checks live.
on:
  schedule:
    # Mondays, 06:00 UTC. Scheduled runs always use the default branch.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: quality
  cancel-in-progress: true

# Nothing by default: every job declares the scopes it needs, so a job
# added without a `permissions:` block gets none rather than the
# repository's default token permissions (#317).
permissions: {}

jobs:
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    # Instrumented runs are roughly 50% slower than the plain suite
    # (~31 s vs ~21 s locally; more on a cold runner).
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `istanbul`, not the default `v8` — V8 coverage is unsupported in
      # @cloudflare/vitest-pool-workers, where the whole server-side suite
      # runs, so the default provider reports nothing for the half of the
      # codebase that matters most. See the comment in vitest.config.ts.
      - name: Run tests with coverage
        run: pnpm --filter ucmc-web test:coverage

      # Uploaded rather than gated. There are no thresholds: picking one
      # before a baseline exists is picking a number out of the air, and a
      # failing threshold teaches people to write tests that execute lines
      # instead of tests that assert things. The baseline at the time this
      # landed was 47.66% of statements.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: apps/ucmc-web/coverage/
          retention-days: 30

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    # Re-runs the test suite once per mutant. Scoped to three pure
    # modules it takes seconds; it is here rather than in ci.yml because
    # that property stops holding the moment the scope widens, and
    # because nothing is blocked on the answer.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs against `vitest.mutation.config.ts`, a plain-Node project
      # that exists only for this: the `workers` pool boots workerd and
      # applies 71 migrations per file, which is unaffordable once per
      # mutant, and its compatibility with Stryker is unverified
      # upstream. Only pure modules can be mutated there — see that
      # config for why.
      #
      # `thresholds.break` is null: this reports, it does not gate. The
      # score was 100% (76/76) when it landed.
      - name: Run Stryker
        run: pnpm --filter ucmc-web test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-html
          path: apps/ucmc-web/reports/mutation/
          retention-days: 30
