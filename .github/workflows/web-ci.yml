name: Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "libs/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"

jobs:
  lint-typecheck-test:
    name: Lint, Type Check, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter ucmc-web lint

      - name: Type check
        run: pnpm --filter ucmc-web typecheck

      - name: Test
        run: pnpm --filter ucmc-web test

  a11y:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter ucmc-web exec playwright install --with-deps chromium

      # Apply Drizzle migrations to the Miniflare-backed local D1 before
      # the dev server boots. Without this, the home-page loader queries
      # `landingContentQueryOptions` which selects from tables that
      # don't exist yet — Vite returns 500 on every request, and
      # Playwright's webServer probe treats every 500 as "not ready" and
      # times out after 120 s. Local dev applies migrations once via
      # `db:migrate:local`; CI starts from zero state on each runner.
      - name: Apply local D1 migrations
        run: pnpm --filter ucmc-web db:migrate:local

      # Runs axe-core against every public + auth-entry route. Fails the
      # job on any `serious` or `critical` violation (WCAG 2.1 AA gate
      # per UC EIT 9.2.1). The spec doesn't need Mailpit, so no sidecar
      # is required.
      #
      # Worker env vars are passthrough placeholders — the dev server's
      # first SSR request crashes without APP_BASE_URL / SESSION_SECRET
      # / WEBAUTHN_RP_ID populated. None of these are secrets in the
      # test environment; they exist only to satisfy module-load
      # assertions on a transient runner.
      - name: Run axe-core specs
        env:
          # CLOUDFLARE_INCLUDE_PROCESS_ENV makes wrangler v4 forward
          # process env into the worker. The devcontainer sets this in
          # docker-compose; CI has to opt in explicitly.
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
          APP_BASE_URL: http://localhost:3000
          WEBAUTHN_RP_ID: localhost
          WEBAUTHN_RP_NAME: UCMC (ci)
          RESEND_FROM: noreply@localhost
          RESEND_FROM_NAME: UCMC (ci)
          SESSION_SECRET: ci-test-session-secret-32-bytes-long-enough
          MAILPIT_URL: ""
        run: pnpm --filter ucmc-web e2e a11y.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-a11y
          path: apps/web/playwright-report/
          retention-days: 7
