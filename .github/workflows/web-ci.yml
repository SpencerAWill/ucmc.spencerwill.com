name: Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "libs/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"

jobs:
  lint-typecheck-test:
    name: Lint, Type Check, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter ucmc-web lint

      - name: Type check
        run: pnpm --filter ucmc-web typecheck

      - name: Test
        run: pnpm --filter ucmc-web test

  a11y:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter ucmc-web exec playwright install --with-deps chromium

      # Runs axe-core against every public + auth-entry route. Fails the
      # job on any `serious` or `critical` violation (WCAG 2.1 AA gate
      # per UC EIT 9.2.1). The spec doesn't need Mailpit, so no sidecar
      # is required.
      - name: Run axe-core specs
        run: pnpm --filter ucmc-web e2e a11y.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y
          path: apps/web/playwright-report/
          retention-days: 7
