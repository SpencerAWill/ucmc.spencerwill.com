name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

jobs:
  # Computes once which side of the monorepo changed. On `push` we use
  # this to skip infra-dev / web-dev when neither was touched; on
  # `workflow_dispatch` the inputs decide and these outputs are ignored.
  paths:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: filter
        # dorny/paths-filter on `push` events compares HEAD against the
        # previous commit on the branch.
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web:
              - 'apps/ucmc-web/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deploy.yml'
            infra:
              - 'infra/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deploy.yml'

  infra-dev:
    name: Infra — deploy dev
    needs: paths
    if: |
      (github.event_name == 'push' && needs.paths.outputs.infra == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: dev
    # Shared with web-dev so infra and web serialize per-env.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: dev
          work-dir: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_MANAGEMENT_API_KEY: ${{ secrets.RESEND_MANAGEMENT_API_KEY }}

  web-dev:
    name: Web — deploy dev
    needs: [paths, infra-dev]
    # Run when the web side changed OR infra changed (to pick up rotated
    # Pulumi outputs the worker reads via --var or UUID injection — D1
    # ID, KV ID, Resend key, RP IDs, Turnstile keys). `always()` is
    # required so this job still runs when infra-dev was skipped on a
    # web-only push. Web-dev still fails if infra-dev itself failed.
    if: |
      always() &&
      (needs.infra-dev.result == 'success' || needs.infra-dev.result == 'skipped') &&
      (
        (github.event_name == 'push' && (needs.paths.outputs.web == 'true' || needs.paths.outputs.infra == 'true')) ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pulumi is the source of truth for the D1 database UUID and the KV
      # namespace UUID. Must run BEFORE build because @cloudflare/vite-plugin
      # snapshots wrangler.jsonc into dist/server/wrangler.json at build
      # time; `wrangler deploy` reads that snapshot, not the source file.
      # Injecting after build would leave placeholder UUIDs in the deployed
      # artifact.
      - uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0

      - name: Fetch resource IDs and vars from Pulumi
        id: pulumi
        working-directory: infra
        run: |
          pulumi stack select dev
          {
            echo "database_id=$(pulumi stack output d1DatabaseId)"
            echo "kv_id=$(pulumi stack output kvNamespaceId)"
            echo "app_base_url=$(pulumi stack output appBaseUrl)"
            echo "webauthn_rp_id=$(pulumi stack output webauthnRpId)"
            echo "webauthn_rp_name=$(pulumi stack output webauthnRpName)"
            echo "resend_from=$(pulumi stack output resendFromEmail)"
            echo "resend_from_name=$(pulumi stack output resendFromName)"
            echo "turnstile_site_key=$(pulumi stack output turnstileSiteKey)"
            echo "r2_public_host=$(pulumi stack output r2PublicHost)"
          } >> "$GITHUB_OUTPUT"
          # Secret outputs: masked in job logs, used only as env vars for
          # the deploy step. `--show-secrets` is required to get plaintext.
          echo "::add-mask::$(pulumi stack output resendApiKey --show-secrets)"
          echo "resend_api_key=$(pulumi stack output resendApiKey --show-secrets)" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$(pulumi stack output turnstileSecretKey --show-secrets)"
          echo "turnstile_secret_key=$(pulumi stack output turnstileSecretKey --show-secrets)" >> "$GITHUB_OUTPUT"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Inject D1 UUID into wrangler.jsonc
        env:
          RESOURCE_ID: ${{ steps.pulumi.outputs.database_id }}
        run: sed -i "s/00000000-0000-0000-0000-000000000000/$RESOURCE_ID/" apps/ucmc-web/wrangler.jsonc

      - name: Inject KV UUID into wrangler.jsonc
        env:
          RESOURCE_ID: ${{ steps.pulumi.outputs.kv_id }}
        run: sed -i "s/22222222-2222-2222-2222-222222222222/$RESOURCE_ID/" apps/ucmc-web/wrangler.jsonc

      - name: Build (dev env)
        # Top-level wrangler.jsonc config IS the dev worker, so CLOUDFLARE_ENV
        # must be unset here — setting it to "dev" would make
        # @cloudflare/vite-plugin look up a nonexistent env.dev override.
        run: pnpm --filter ucmc-web build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ steps.pulumi.outputs.turnstile_site_key }}
          # CDN hostname for the public R2 bucket. Vite bakes this into
          # the client bundle so avatar/landing image URLs point at
          # cdn.dev.ucmc.spencerwill.com directly, bypassing the worker.
          VITE_R2_PUBLIC_HOST: ${{ steps.pulumi.outputs.r2_public_host }}

      - name: Apply D1 migrations (dev)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/ucmc-web
          command: d1 migrations apply ucmc-web-dev --remote

      # Secrets are uploaded via `wrangler secret put` (one call per name)
      # immediately before `wrangler deploy`. SESSION_SECRET,
      # TURNSTILE_SECRET_KEY, FEEDBACK_GITHUB_TOKEN, and
      # FEEDBACK_GITHUB_REPO come from the GitHub `dev` environment;
      # RESEND_API_KEY comes from the Pulumi stack output (the
      # sending-scoped key that the ResendDomain component issues),
      # masked above so it doesn't leak in job logs. The two
      # FEEDBACK_GITHUB_* secrets are optional — leave them unset to
      # disable the GitHub mirror; submissions still land in D1.
      - name: Deploy Worker (dev)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/ucmc-web
          secrets: |
            SESSION_SECRET
            RESEND_API_KEY
            TURNSTILE_SECRET_KEY
            FEEDBACK_GITHUB_TOKEN
            FEEDBACK_GITHUB_REPO
          command: >-
            deploy
            --var APP_BASE_URL:${{ steps.pulumi.outputs.app_base_url }}
            --var WEBAUTHN_RP_ID:${{ steps.pulumi.outputs.webauthn_rp_id }}
            --var WEBAUTHN_RP_NAME:${{ steps.pulumi.outputs.webauthn_rp_name }}
            --var RESEND_FROM:${{ steps.pulumi.outputs.resend_from }}
            --var RESEND_FROM_NAME:${{ steps.pulumi.outputs.resend_from_name }}
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          RESEND_API_KEY: ${{ steps.pulumi.outputs.resend_api_key }}
          TURNSTILE_SECRET_KEY: ${{ steps.pulumi.outputs.turnstile_secret_key }}
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
          FEEDBACK_GITHUB_REPO: ${{ vars.FEEDBACK_GITHUB_REPO }}

      # ── Post-deploy verification ──────────────────────────────────────
      #
      # Until now this workflow applied D1 migrations and pushed a worker
      # with nothing checking the result: a deploy that 500s on every
      # request, or whose client bundle throws on hydration, looked
      # exactly like a good one until a human loaded the site.
      #
      # These steps live INSIDE the deploy job rather than in a job of
      # their own on purpose. A separate job would re-run checkout,
      # setup-node and `pnpm install` — roughly two minutes of runner
      # time — to learn something this job can check directly, and would
      # need `app_base_url` plumbed through as a job output to do it.
      # Here, a failure also turns the deploy job itself red, which is
      # what "fail loudly" has to mean.
      #
      # **The Playwright smoke test is the whole check — do not add a
      # `curl` precursor in front of it.** There was one, and it never
      # passed once: Cloudflare 403s a bare `curl` from a datacenter ASN
      # at the edge, before the Worker is reached, and GitHub runners sit
      # on Microsoft ranges. It returned 403 on all 30 attempts of every
      # run while the same URL served 200 to any browser. Sending browser
      # headers did not fix it either — bot scoring fingerprints the TLS
      # handshake, which `curl` cannot fake whatever headers it sends.
      # The net effect was a red deploy on a healthy worker, and the real
      # check never running because the fake one had already failed the
      # job. Playwright drives real Chromium, so it is on the right side
      # of that score, and it asserts hydration and `/health` rather than
      # just a status code.
      # Keyed on the resolved Playwright version, same as the CI jobs, so
      # a deploy usually restores the binaries instead of downloading
      # them. Chromium only — the smoke project is Desktop Chrome.
      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(pnpm --filter ucmc-web exec playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter ucmc-web exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter ucmc-web exec playwright install-deps chromium

      # `PLAYWRIGHT_BASE_URL` both points the run at the deployed worker
      # and suppresses the `webServer` block in playwright.config.ts —
      # there is no dev server for this run to own. The `smoke` project
      # is read-only and unauthenticated (see e2e/smoke.spec.ts); it must
      # stay that way, because dev is a real environment.
      - name: Post-deploy smoke test (dev)
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.pulumi.outputs.app_base_url }}
        run: pnpm --filter ucmc-web e2e --project=smoke

      - name: Upload smoke report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-smoke-dev
          path: apps/ucmc-web/playwright-report/
          retention-days: 7

  infra-prod:
    name: Infra — deploy prod
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: prod
          work-dir: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_MANAGEMENT_API_KEY: ${{ secrets.RESEND_MANAGEMENT_API_KEY }}

  web-prod:
    name: Web — deploy prod
    needs: infra-prod
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0

      - name: Fetch resource IDs and vars from Pulumi
        id: pulumi
        working-directory: infra
        run: |
          pulumi stack select prod
          {
            echo "database_id=$(pulumi stack output d1DatabaseId)"
            echo "kv_id=$(pulumi stack output kvNamespaceId)"
            echo "app_base_url=$(pulumi stack output appBaseUrl)"
            echo "webauthn_rp_id=$(pulumi stack output webauthnRpId)"
            echo "webauthn_rp_name=$(pulumi stack output webauthnRpName)"
            echo "resend_from=$(pulumi stack output resendFromEmail)"
            echo "resend_from_name=$(pulumi stack output resendFromName)"
            echo "turnstile_site_key=$(pulumi stack output turnstileSiteKey)"
            echo "r2_public_host=$(pulumi stack output r2PublicHost)"
          } >> "$GITHUB_OUTPUT"
          echo "::add-mask::$(pulumi stack output resendApiKey --show-secrets)"
          echo "resend_api_key=$(pulumi stack output resendApiKey --show-secrets)" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$(pulumi stack output turnstileSecretKey --show-secrets)"
          echo "turnstile_secret_key=$(pulumi stack output turnstileSecretKey --show-secrets)" >> "$GITHUB_OUTPUT"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Inject D1 UUID into wrangler.jsonc
        env:
          RESOURCE_ID: ${{ steps.pulumi.outputs.database_id }}
        run: sed -i "s/11111111-1111-1111-1111-111111111111/$RESOURCE_ID/" apps/ucmc-web/wrangler.jsonc

      - name: Inject KV UUID into wrangler.jsonc
        env:
          RESOURCE_ID: ${{ steps.pulumi.outputs.kv_id }}
        run: sed -i "s/33333333-3333-3333-3333-333333333333/$RESOURCE_ID/" apps/ucmc-web/wrangler.jsonc

      - name: Build (production env)
        run: pnpm --filter ucmc-web build
        env:
          CLOUDFLARE_ENV: production
          VITE_TURNSTILE_SITE_KEY: ${{ steps.pulumi.outputs.turnstile_site_key }}
          # CDN hostname for the public R2 bucket — baked into the client
          # bundle at build time so avatar/landing URLs hit
          # cdn.ucmc.spencerwill.com directly.
          VITE_R2_PUBLIC_HOST: ${{ steps.pulumi.outputs.r2_public_host }}

      - name: Apply D1 migrations (prod)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/ucmc-web
          command: d1 migrations apply ucmc-web --env production --remote

      # SESSION_SECRET, FEEDBACK_GITHUB_TOKEN, and FEEDBACK_GITHUB_REPO
      # come from the GitHub `prod` environment; RESEND_API_KEY and
      # TURNSTILE_SECRET_KEY come from Pulumi stack outputs (the
      # sending-scoped key and widget secret, respectively), fetched and
      # masked above. The FEEDBACK_GITHUB_* values are optional — leave
      # them unset to disable the mirror; submissions still land in D1.
      #
      # `environment: production` is required so wrangler-action runs
      # `wrangler secret put NAME --env production`. Without it, the
      # action falls back to the top-level worker (ucmc-web-dev) when
      # multiple environments are defined in wrangler.jsonc — every
      # prior prod deploy was silently uploading prod's secrets into
      # the dev worker, leaving prod with no secrets at all. The dev
      # job correctly omits this input because dev IS the top-level
      # worker.
      - name: Deploy Worker (prod)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/ucmc-web
          environment: production
          secrets: |
            SESSION_SECRET
            RESEND_API_KEY
            TURNSTILE_SECRET_KEY
            FEEDBACK_GITHUB_TOKEN
            FEEDBACK_GITHUB_REPO
          command: >-
            deploy --env production
            --var APP_BASE_URL:${{ steps.pulumi.outputs.app_base_url }}
            --var WEBAUTHN_RP_ID:${{ steps.pulumi.outputs.webauthn_rp_id }}
            --var WEBAUTHN_RP_NAME:${{ steps.pulumi.outputs.webauthn_rp_name }}
            --var RESEND_FROM:${{ steps.pulumi.outputs.resend_from }}
            --var RESEND_FROM_NAME:${{ steps.pulumi.outputs.resend_from_name }}
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          RESEND_API_KEY: ${{ steps.pulumi.outputs.resend_api_key }}
          TURNSTILE_SECRET_KEY: ${{ steps.pulumi.outputs.turnstile_secret_key }}
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
          FEEDBACK_GITHUB_REPO: ${{ vars.FEEDBACK_GITHUB_REPO }}

      # ── Post-deploy verification ──────────────────────────────────────
      #
      # Until now this workflow applied D1 migrations and pushed a worker
      # with nothing checking the result: a deploy that 500s on every
      # request, or whose client bundle throws on hydration, looked
      # exactly like a good one until a human loaded the site.
      #
      # These steps live INSIDE the deploy job rather than in a job of
      # their own on purpose. A separate job would re-run checkout,
      # setup-node and `pnpm install` — roughly two minutes of runner
      # time — to learn something this job can check directly, and would
      # need `app_base_url` plumbed through as a job output to do it.
      # Here, a failure also turns the deploy job itself red, which is
      # what "fail loudly" has to mean.
      #
      # **The Playwright smoke test is the whole check — do not add a
      # `curl` precursor in front of it.** There was one, and it never
      # passed once: Cloudflare 403s a bare `curl` from a datacenter ASN
      # at the edge, before the Worker is reached, and GitHub runners sit
      # on Microsoft ranges. It returned 403 on all 30 attempts of every
      # run while the same URL served 200 to any browser. Sending browser
      # headers did not fix it either — bot scoring fingerprints the TLS
      # handshake, which `curl` cannot fake whatever headers it sends.
      # The net effect was a red deploy on a healthy worker, and the real
      # check never running because the fake one had already failed the
      # job. Playwright drives real Chromium, so it is on the right side
      # of that score, and it asserts hydration and `/health` rather than
      # just a status code.
      # Keyed on the resolved Playwright version, same as the CI jobs, so
      # a deploy usually restores the binaries instead of downloading
      # them. Chromium only — the smoke project is Desktop Chrome.
      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(pnpm --filter ucmc-web exec playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter ucmc-web exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter ucmc-web exec playwright install-deps chromium

      # `PLAYWRIGHT_BASE_URL` both points the run at the deployed worker
      # and suppresses the `webServer` block in playwright.config.ts —
      # there is no dev server for this run to own. The `smoke` project
      # is read-only and unauthenticated (see e2e/smoke.spec.ts); it must
      # stay that way, because prod is a real environment.
      - name: Post-deploy smoke test (prod)
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.pulumi.outputs.app_base_url }}
        run: pnpm --filter ucmc-web e2e --project=smoke

      - name: Upload smoke report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-smoke-prod
          path: apps/ucmc-web/playwright-report/
          retention-days: 7
