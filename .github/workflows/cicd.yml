# One pipeline from check to prod (#312, docs/adr/0002-one-pipeline-from-check-to-prod.md).
#
#   pull_request   the checks, and a `pulumi preview` of both stacks
#   push to main   the same checks, unfiltered, then `required`, then
#                  deploy-dev, then deploy-prod once a reviewer approves
#                  the `prod` environment IN THIS RUN
#
# So prod only ever gets a commit that passed every check and deployed
# and smoke-tested on dev first. It used to be a `workflow_dispatch` of a
# separate deploy.yml on any ref, which tied what reached prod to nothing.
#
# The ruleset requires one status check, `required`, which waits on every
# other check. Rename or add jobs freely; a new CHECK goes in its `needs:`.
# The deploy steps live in .github/actions/deploy, used once per
# environment.
name: CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Break-glass: re-run the whole pipeline for main's head (checks, dev,
  # then prod behind its reviewer), e.g. after a failed deploy whose cause
  # was outside the repo. The deploy jobs run only on main, and the
  # environments' branch policies refuse any other ref anyway.
  workflow_dispatch:

# One in-flight run per PR: pushing a fixup cancels the superseded run.
# The history once showed three complete runs of the same PR inside eight
# minutes, every one superseded before it finished.
#
# Runs on main are keyed by commit and never cancelled, so every merge
# gets a complete result and a deploy is never cut off halfway. Each
# deploy job also queues per environment (see deploy-dev).
#
# `pulumi-preview` keeps its own narrower group: it comments on the PR, so
# it wants to be cancellable independently of the rest of the run.
concurrency:
  group: cicd-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing by default: every job declares the scopes it needs, so a job
# added without a `permissions:` block gets none rather than the
# repository's default token permissions (#317).
permissions: {}

jobs:
  # Computes once per PR which side of the monorepo changed; downstream
  # jobs use these outputs as their `if:` gate.
  #
  # Off a PR, every output is `true`: a push or a dispatch runs every
  # check, because what it deploys is the merged tree, which no PR run
  # tested exactly, and a skipped check must never be what lets a deploy
  # through. (paths-filter on a push diffs against the previous commit
  # only, which isn't "everything since the last deploy" either.)
  paths:
    name: Detect changed paths
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      infra: ${{ github.event_name != 'pull_request' || steps.filter.outputs.infra == 'true' }}
      infra_cloudflare: ${{ github.event_name != 'pull_request' || steps.filter.outputs.infra_cloudflare == 'true' }}
      workflows: ${{ github.event_name != 'pull_request' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web:
              - 'apps/ucmc-web/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/cicd.yml'
            infra:
              - 'infra/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/cicd.yml'
            # What a `pulumi preview` of infra/cloudflare can change: its
            # program, and the provider/runtime versions in the lockfile.
            # infra/github isn't previewed in CI (it's applied locally).
            infra_cloudflare:
              - 'infra/cloudflare/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/cicd.yml'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/zizmor.yml'

  # Secret scan of the full history (#316). Not path-filtered and cheap
  # (~400 commits in about a second), so it runs on every PR: the
  # pre-commit hook scans staged changes too, but it is skipped on a host
  # without gitleaks and bypassed by `--no-verify`, and this is the gate
  # for both. Full history (`fetch-depth: 0`) rather than the PR's commits,
  # so a secret that slipped in some other way still turns a PR red. It
  # was clean when this job landed, so there is no allowlist; a false
  # positive goes in a commented `.gitleaks.toml`, never an inline ignore.
  # Scoped to HEAD's history (`--log-opts`): gitleaks' default is `--all`,
  # and `fetch-depth: 0` fetches every branch, so a secret on someone
  # else's unmerged branch would otherwise turn every PR red.
  #
  # Installed like actionlint and zizmor: pinned release, SHA-256 checked.
  # The version matches `.devcontainer/Dockerfile`; bump both together.
  # No `needs: paths` — it reads none of its outputs.
  secrets:
    name: Secrets — gitleaks
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: gitleaks
        run: ./gitleaks git --log-opts="--full-history HEAD" --redact --no-banner --verbose .

  # Workspace-level supply-chain checks. Runs once regardless of which
  # side changed — each walks the whole lockfile, so splitting by path
  # gave no additional coverage.
  #
  # Besides `pnpm audit`, it enforces `trustPolicy` over the LOCKED tree.
  # Every other install in CI is `--frozen-lockfile`, which resolves nothing
  # and so never runs the provenance check; a Dependabot bump or a `pnpm
  # add` that slipped a downgraded version into the lockfile would merge
  # green. `--fix-lockfile` makes pnpm re-validate every locked version
  # (~4 s, metadata only, no node_modules); a healthy lockfile comes back
  # byte-identical, so `git diff --exit-code` fails on anything else
  # (#317). It only goes red when the lockfile is wrong, never because
  # upstream published something new — unlike a from-scratch resolve.
  audit:
    name: Audit — advisories, provenance, image pins
    if: github.event.pull_request.draft != true
    needs: paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level high --prod

      # The state file is pnpm's "nothing changed since the last install"
      # marker, and the frozen install above just wrote it: with it present
      # this command prints "Already up to date" and checks NOTHING, so it
      # could never fail. Removing it is what makes the step a real check.
      - name: Provenance (trustPolicy) over the locked tree
        run: |
          rm -f node_modules/.pnpm-workspace-state-v1.json
          pnpm install --lockfile-only --fix-lockfile --ignore-scripts
          git diff --exit-code pnpm-lock.yaml

      # Mailpit runs as this file's `e2e-desktop` service and in the
      # devcontainer. Dependabot bumps only the compose file, so this is
      # what notices the two drifting apart.
      - name: Mailpit pins agree
        run: |
          # Anchored on `image:` so this step's own source can't match.
          pin() { sed -nE 's/^[[:space:]]*image:[[:space:]]*(axllent\/mailpit:[^[:space:]]+).*/\1/p' "$1"; }
          ci=$(pin .github/workflows/cicd.yml)
          compose=$(pin .devcontainer/docker-compose.yml)
          if [ -z "$ci" ] || [ -z "$compose" ]; then
            echo "::error::Mailpit image line not found — cicd.yml: '$ci', docker-compose.yml: '$compose'"
            exit 1
          fi
          if [ "$ci" != "$compose" ]; then
            echo "::error::Mailpit pins differ — cicd.yml: $ci, docker-compose.yml: $compose"
            exit 1
          fi

      # Both E2E jobs run in `mcr.microsoft.com/playwright`, whose browser
      # builds belong to one Playwright release. A `@playwright/test` bump
      # (Dependabot's, usually) that leaves the image behind fails every
      # spec on "Executable doesn't exist"; this fails first, and says why.
      - name: Playwright image matches @playwright/test
        run: |
          # Read from the installed package, not `playwright --version`
          # through `pnpm exec`: in this job pnpm wrote more than the
          # version line to stdout, and `awk '{print $2}'` came out as
          # "all" (#369's first run). The package.json is the exact string.
          want=$(node -p "require('./apps/ucmc-web/node_modules/@playwright/test/package.json').version")
          # Anchored on `image:` so this step's own source can't match.
          pins=$(sed -nE 's/^[[:space:]]*image:[[:space:]]*mcr\.microsoft\.com\/playwright:v([0-9][^-@[:space:]]*)-.*/\1/p' .github/workflows/cicd.yml)
          if [ "$(printf '%s\n' "$pins" | grep -c .)" -ne 2 ]; then
            echo "::error::Expected 2 Playwright image pins in cicd.yml (e2e-desktop, e2e-viewports), found: '$pins'"
            exit 1
          fi
          for pin in $pins; do
            if [ "$pin" != "$want" ]; then
              echo "::error::Playwright image is v$pin but @playwright/test is $want. Move both E2E jobs to mcr.microsoft.com/playwright:v$want-noble, pinned by its index digest."
              exit 1
            fi
          done
          echo "Playwright image pins match @playwright/test $want"

  web-lint-test:
    name: Web — lint, typecheck, knip, drift, test
    if: github.event.pull_request.draft != true && needs.paths.outputs.web == 'true'
    needs: paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter ucmc-web lint

      - name: Type check
        run: pnpm --filter ucmc-web typecheck

      # Dead code, unused exports, unused dependencies. Config and the
      # rationale for every suppression live in apps/ucmc-web/knip.config.ts.
      - name: Knip
        run: pnpm --filter ucmc-web knip

      # schema.ts vs the newest migration snapshot (#318): fails when a
      # schema change has no migration, or a migration skipped `generate`.
      # Runs on a temp copy of the migrations, so it writes nothing here.
      - name: Migration drift
        run: pnpm --filter ucmc-web db:drift

      - name: Test
        run: pnpm --filter ucmc-web test

  infra-lint:
    name: Infra — lint, typecheck
    if: github.event.pull_request.draft != true && needs.paths.outputs.infra == 'true'
    needs: paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter "@ucmc/infra-*" lint

      - name: Type check
        run: pnpm --filter "@ucmc/infra-*" typecheck

  # ── E2E ───────────────────────────────────────────────────────────────
  #
  # Two jobs, split by browser matrix rather than by spec name, running in
  # parallel so the suite costs one job's wall-clock rather than two.
  #
  # The split used to be "the three specs that work without Mailpit" vs
  # "everything else, local-only" — 10 of 14 specs, including every
  # sign-in, gear-desk and member-management flow, never ran on a PR. A
  # Mailpit service container removes the reason for that, so the only
  # remaining reason to split is the browser download: `e2e-viewports`
  # needs WebKit, `e2e-desktop` doesn't.
  #
  # Each job selects by Playwright PROJECT, not by file name, and that is
  # what keeps the two in sync without a workflow edit. The projects'
  # own `testMatch`/`testIgnore` in playwright.config.ts already partition
  # the suite — `mobile-*` and `reflow-pages` to the two mobile projects,
  # the reflow specs to `reflow-sweep` / `reflow-overlays`, everything else
  # to chromium — so a spec added tomorrow runs in CI by construction. The
  # previous arrangement named files in the workflow, which is precisely
  # how 10 specs stayed uncovered.
  e2e-desktop:
    name: E2E — desktop Chromium (full suite)
    if: github.event.pull_request.draft != true && needs.paths.outputs.web == 'true'
    needs: paths
    runs-on: ubuntu-latest
    # The whole chromium project, serially: `workers: 1`, because the
    # specs share one local D1 and cannot be parallelised — two workers
    # would collide on `user_emails.email`'s global UNIQUE and on the
    # delete-then-insert each seed opens with. Investigated and declined
    # in #238: this job and e2e-viewports run in parallel and are within
    # ~15s of each other, so the remaining prize is ~70s. If it is ever
    # wanted, `--shard=i/n` across runners is the cheaper route and needs
    # no isolation work. `retries: 2` on CI.
    timeout-minutes: 30
    permissions:
      contents: read

    # Microsoft's Playwright image: Node 24 (as `.nvmrc`), every browser
    # at `PLAYWRIGHT_BROWSERS_PATH=/ms-playwright`, and every system
    # library they need. This used to cache the browser binaries and run
    # `playwright install-deps` on each job, which is ~150 apt packages
    # for WebKit — and on 2026-10-26 the Ubuntu mirror served them at
    # ~60 KB/s, so this job hit its timeout twice in a row before running
    # a single spec. Nothing is installed at job time now.
    #
    # Version AND index digest, like every image here. **The tag must
    # equal the locked `@playwright/test`**, or the library looks for
    # browser builds the image doesn't carry; the `audit` job fails when
    # they differ, which is what catches a Dependabot bump. Both E2E jobs
    # pin the same line. `--ipc=host` is Playwright's own recommendation:
    # Docker's 64 MB /dev/shm is small enough to crash Chromium.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host

    # Magic-link, passkey, preadd and claim flows all need a mailbox. The
    # app POSTs to `${MAILPIT_URL}/api/v1/send` over HTTP (see
    # src/server/email/resend.ts) and the Playwright fixture polls the
    # same REST API, so only the 8025 listener matters — the devcontainer
    # also publishes SMTP on 1025, which nothing here speaks.
    services:
      mailpit:
        # Version AND index digest (#317): a tag can be re-pointed, a digest
        # can't. Same pin as `.devcontainer/docker-compose.yml`. Dependabot's
        # github-actions ecosystem doesn't read service images, so bump this
        # by hand alongside the compose file when Dependabot moves that one.
        image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387

    # Worker env vars are passthrough placeholders — the dev server's
    # first SSR request crashes without APP_BASE_URL / SESSION_SECRET /
    # WEBAUTHN_RP_ID populated. None of these are secrets in the test
    # environment; they exist only to satisfy module-load assertions on a
    # transient runner. Job-level rather than repeated per step, now that
    # there is more than one spec invocation to keep in agreement.
    env:
      # CLOUDFLARE_INCLUDE_PROCESS_ENV makes wrangler v4 forward process
      # env into the worker. The devcontainer sets this in
      # docker-compose; CI has to opt in explicitly.
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
      APP_BASE_URL: http://localhost:3000
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: UCMC (ci)
      RESEND_FROM: noreply@localhost
      RESEND_FROM_NAME: UCMC (ci)
      SESSION_SECRET: ci-test-session-secret-32-bytes-long-enough
      # A container job shares a Docker network with its services, so
      # Mailpit is reached by service name — the devcontainer's address
      # and the fixture's default. (It was `localhost:8025` while the job
      # ran on the bare runner, where services publish to loopback.) Read
      # by the Playwright fixture directly, and by the worker via the
      # webServer env block in playwright.config.ts.
      MAILPIT_URL: http://mailpit:8025

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Apply Drizzle migrations to the Miniflare-backed local D1 before
      # the dev server boots. Without this, the home-page loader queries
      # `landingContentQueryOptions` which selects from tables that don't
      # exist yet — Vite returns 500 on every request, and Playwright's
      # webServer probe treats every 500 as "not ready" and times out
      # after 120 s. Local dev applies migrations once via
      # `db:migrate:local`; CI starts from zero state on each runner.
      - name: Apply local D1 migrations
        run: pnpm --filter ucmc-web db:migrate:local

      # GitHub starts the service container but does not wait for the
      # process inside it to bind. The mailpit fixture clears the inbox in
      # a `beforeEach` and throws if that request fails, so losing this
      # race surfaces as an unrelated-looking failure in whichever spec
      # happens to run first.
      - name: Wait for Mailpit
        run: |
          for i in $(seq 1 30); do
            if curl -sSf http://mailpit:8025/api/v1/info > /dev/null 2>&1; then
              echo "mailpit ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "mailpit did not become ready within 30s" >&2
          exit 1

      # The whole chromium project: the axe-core WCAG 2.1 AA gate, the
      # real ZXing WASM decode, and the 10 flows that until now only ran
      # on a developer's laptop. Chromium only, though the image carries
      # WebKit: the passkey specs drive a WebAuthn virtual authenticator
      # over CDP, which WebKit has no equivalent for, and gear-scanner
      # launches its own Chromium with fake-camera flags.
      - name: Run E2E specs
        run: pnpm --filter ucmc-web e2e --project=chromium

      # The suite above drives `vite dev`, which is NOT the worker that
      # ships. `vite build` splits chunks, stubs `cloudflare:workers` out
      # of the client bundle, bundles for SSR and writes an asset
      # manifest; dev transforms modules on demand and papers over all of
      # it. A bundle that throws on hydration, or a chunk that 404s
      # against a stale manifest, is invisible until a deploy.
      #
      # `E2E_PREVIEW=1` points the Playwright webServer at
      # `pnpm build && pnpm preview`, which serves `dist/` through
      # workerd — the same artifact `wrangler deploy` ships.
      #
      # `@deployed` is excluded: that tag marks the `/health` assertion,
      # which needs a real deployment. Against `vite preview` the
      # worker's outbound fetch to a loopback Mailpit does not arrive
      # (the dev server's does — verified both ways), so the email probe
      # would fail for a reason that says nothing about the build, and
      # D1/R2/KV there are Miniflare rather than the real bindings.
      # The deploy jobs run the full smoke, tag included, after each
      # deploy.
      - name: Smoke-test the production build
        env:
          E2E_PREVIEW: "1"
        run: pnpm --filter ucmc-web e2e --project=smoke --grep-invert "@deployed"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-desktop
          path: apps/ucmc-web/playwright-report/
          retention-days: 7

  e2e-viewports:
    name: E2E — ${{ matrix.label }}
    if: github.event.pull_request.draft != true && needs.paths.outputs.web == 'true'
    needs: paths
    runs-on: ubuntu-latest
    # One runner per project, in parallel, so this job costs its slowest
    # entry rather than their sum. Selection stays by project. Folded into
    # one runner, the reflow work added in #243 made this ~8 min of specs:
    # the CI long pole #239 had just removed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mobile Safari
            project: mobile-safari
          - label: mobile Chrome
            project: mobile-chrome
          - label: reflow sweep
            project: reflow-sweep
          - label: reflow overlays
            project: reflow-overlays
    timeout-minutes: 20
    permissions:
      contents: read

    # The same image and pin as `e2e-desktop` — see the note there.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host

    env:
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
      APP_BASE_URL: http://localhost:3000
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: UCMC (ci)
      RESEND_FROM: noreply@localhost
      RESEND_FROM_NAME: UCMC (ci)
      SESSION_SECRET: ci-test-session-secret-32-bytes-long-enough
      # No Mailpit here on purpose: every spec these projects match seeds
      # its session directly via `seedSession`, so no runner needs a
      # mailbox or pays for a service container.
      MAILPIT_URL: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply local D1 migrations
        run: pnpm --filter ucmc-web db:migrate:local

      # `reflow-pages` walks every route and fails if anything made the
      # document wider than the viewport — easy to regress, since each
      # cause (`-mx-*`, a fixed `w-[Npx]`, a flex item without `min-w-0`)
      # is reasonable in isolation and the symptom is invisible at desktop
      # width. It runs at the two phone widths in both engines, because
      # `overflow` axis computation and `touch-action` handling are
      # exactly where WebKit and Blink have diverged before and iOS
      # Safari is what the membership carries — and in `reflow-sweep`
      # from 320px through every breakpoint edge, which is where #243
      # found the bugs the phone widths never saw. `reflow-overlays`
      # opens every dialog and sheet it can find, at 320px, in its own
      # project. `mobile-waiver-queue` measures that selecting a member
      # doesn't move the rows under the officer's finger.
      - name: Run specs
        env:
          PROJECT: ${{ matrix.project }}
        run: pnpm --filter ucmc-web e2e --project="$PROJECT"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/ucmc-web/playwright-report/
          retention-days: 7

  # Static analysis for the workflows themselves. Nothing else looks at
  # them: ESLint, tsc and knip all stop at the repo's source, and a
  # workflow defect only shows up when the workflow runs — which for the
  # deploy jobs and .github/actions/deploy means on main, in production.
  #
  # Two tools, because they see different things. `actionlint` checks the
  # schema, the `${{ }}` expression types, and (via shellcheck) the `run:`
  # scripts. `zizmor` audits for security shapes: template injection,
  # credential persistence, dangerous triggers, cache poisoning.
  #
  # Both are installed from pinned release tarballs with a SHA-256 check
  # rather than `curl | bash` or a third-party wrapper package. Adding an
  # unverified download to the workflow that exists to catch
  # supply-chain problems would be an odd way to start.
  workflow-lint:
    name: Workflows — actionlint, zizmor
    if: github.event.pull_request.draft != true && needs.paths.outputs.workflows == 'true'
    needs: paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.30.1
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar xzf actionlint.tar.gz actionlint
          ./actionlint --version

      - name: Install zizmor
        run: |
          curl -fsSL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum --check --strict
          tar xzf zizmor.tar.gz zizmor
          ./zizmor --version

      # shellcheck is preinstalled on ubuntu-latest, so actionlint picks
      # it up and lints every `run:` body as well as the YAML.
      - name: actionlint
        run: ./actionlint -color

      # Config and the reason for every ignore live in .github/zizmor.yml.
      # The local actions too: the deploy steps live in one.
      - name: zizmor
        run: ./zizmor --color always .github/workflows/ .github/actions/

  # `pulumi preview` of both infra/cloudflare stacks, one sticky comment
  # per stack (pulumi/actions finds its comment by a heading that names the
  # stack). prod is previewed too: its config differs from dev's (Resend
  # through a StackReference, no outbox), so a change can replace something
  # on prod alone, and the next deploy would be the first anyone saw of it.
  #
  # Runs in the `preview` environment, which infra/github gives a reviewer
  # and a read-only Cloudflare token. The Pulumi token comes from OIDC
  # (pulumi/auth-actions) and is personal — it can read every stack's
  # secrets in every repo — so approve a run only for a branch whose
  # changes you have read. One approval covers both stacks.
  #
  # Not part of `required`: a preview informs the review, it doesn't gate
  # the merge, and the deploy computes its own diff anyway. Skipped for
  # Dependabot and forks, whose runs get no environment secrets and can't
  # exchange an OIDC token; push any commit to a Dependabot branch to
  # preview it as yourself.
  pulumi-preview:
    name: Pulumi Preview (${{ matrix.stack }})
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft != true &&
      github.event.pull_request.head.repo.fork != true &&
      github.actor != 'dependabot[bot]' &&
      needs.paths.outputs.infra_cloudflare == 'true'
    needs: [paths, infra-lint]
    strategy:
      fail-fast: false
      matrix:
        stack: [dev, prod]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    permissions:
      contents: read
      id-token: write # the OIDC exchange with Pulumi Cloud
      pull-requests: write # the sticky comment
    concurrency:
      group: pulumi-preview-${{ github.event.pull_request.number }}-${{ matrix.stack }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Exchanges this job's GitHub OIDC token for a Pulumi token lasting at
      # most an hour, and exports it as PULUMI_ACCESS_TOKEN. Pulumi Cloud
      # trusts this repo's dev, prod and preview environments only; the
      # issuer and its policies are in SpencerAWill/spencerwill.com's
      # infra/github (`pulumiOidcRepositories`).
      - uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: ${{ vars.PULUMI_ORGANIZATION }}
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:${{ vars.PULUMI_USER_LOGIN }}
          token-expiration: 3600

      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: preview
          stack-name: ${{ matrix.stack }}
          work-dir: infra/cloudflare
          comment-on-pr: true
        env:
          # Read-only; minted by infra/github.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}

  # The one status check the main ruleset requires (infra/github), so
  # renaming or adding a job never needs a ruleset change. It waits on every
  # check and fails if any failed or was cancelled. A job skipped by its
  # path filter counts as passing, which is what lets docs-only PRs merge.
  # `pulumi-preview` is deliberately absent (see above).
  #
  # It is also the deploy jobs' gate, and off a PR nothing is filtered, so
  # there a skipped check means something went wrong rather than "not
  # relevant": a push or dispatch run fails on a skip too.
  #
  # That only holds while every job listed here depends on `paths` alone.
  # If one ever `needs:` another check, a failure upstream SKIPS it, and a
  # skip passes here: make such a job's result fail `required` explicitly,
  # or list the upstream job too (its failure is then caught directly).
  required:
    name: required
    if: always()
    needs:
      - paths
      - secrets
      - audit
      - web-lint-test
      - infra-lint
      - e2e-desktop
      - e2e-viewports
      - workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every check passed (or, on a PR, was skipped)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::a required check ended with: $result"
              exit 1
            fi
            if [ "$result" = "skipped" ] && [ "$EVENT" != "pull_request" ]; then
              echo "::error::a required check was skipped on a $EVENT run, which deploys"
              exit 1
            fi
          done

  # ── Deploy ──────────────────────────────────────────────────────────────
  #
  # main only, after `required`: dev on every push, then prod in the same
  # run once a reviewer approves the `prod` environment. Both jobs are the
  # local action .github/actions/deploy; only the stack and the
  # environment's secrets differ. One job per environment, because each job
  # naming a protected environment asks for its own approval.
  #
  # Each environment deploys one run at a time and is never cancelled
  # halfway (`cancel-in-progress: false`). GitHub keeps one PENDING run per
  # concurrency group and a newer one replaces it, so of several merges
  # waiting on dev, only the newest deploys next; it contains the others.
  # Whether a prod job waiting for its reviewer counts as pending (so a
  # newer approval request replaces it) is unverified until real runs show
  # it; either way, approve the newest.
  #
  # Migrations run before the new code on each environment, and prod
  # migrates hours or days after dev in the same run, so a migration must
  # only add: expand now, contract in a later release (see the
  # rename-permission-or-setting skill).
  deploy-dev:
    name: Deploy — dev
    needs: required
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # the OIDC exchange with Pulumi Cloud
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: deploy
        uses: ./.github/actions/deploy
        with:
          stack: dev
          pulumi-organization: ${{ vars.PULUMI_ORGANIZATION }}
          pulumi-user-login: ${{ vars.PULUMI_USER_LOGIN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          cloudflare-infra-api-token: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          session-secret: ${{ secrets.SESSION_SECRET }}
          cloudflare-account-read-token: ${{ secrets.CLOUDFLARE_ACCOUNT_READ_TOKEN }}
          site-feedback-github-token: ${{ secrets.SITE_FEEDBACK_GITHUB_TOKEN }}
          site-feedback-github-repo: ${{ vars.SITE_FEEDBACK_GITHUB_REPO }}

  # The same commit, once dev deployed it and passed its smoke test. Waits
  # for the `prod` environment's reviewer (infra/github); a waiting job
  # uses no runner time, and an approval request expires after 30 days.
  # A failed prod smoke test rolls the Worker's code back.
  #
  # Only main's CURRENT head deploys. Each merge waits for its own
  # approval, so approving an older waiting run after a newer one shipped
  # would put prod back on older code, over a schema the newer one may
  # already have migrated. An approval for a superseded commit fails here,
  # before anything is touched; approve the newest run instead.
  deploy-prod:
    name: Deploy — prod
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # the OIDC exchange with Pulumi Cloud
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # Unauthenticated: the repo is public (infra/github keeps it so).
      - name: Refuse a commit main has moved past
        run: |
          head=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ -z "$head" ]; then
            echo "::error::Couldn't read main's head"
            exit 1
          fi
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::main is at $head now, not $GITHUB_SHA. Approve the newest run's prod deploy instead."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: deploy
        uses: ./.github/actions/deploy
        with:
          stack: prod
          pulumi-organization: ${{ vars.PULUMI_ORGANIZATION }}
          pulumi-user-login: ${{ vars.PULUMI_USER_LOGIN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          cloudflare-infra-api-token: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          session-secret: ${{ secrets.SESSION_SECRET }}
          cloudflare-account-read-token: ${{ secrets.CLOUDFLARE_ACCOUNT_READ_TOKEN }}
          site-feedback-github-token: ${{ secrets.SITE_FEEDBACK_GITHUB_TOKEN }}
          site-feedback-github-repo: ${{ vars.SITE_FEEDBACK_GITHUB_REPO }}
