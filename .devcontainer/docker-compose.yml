services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    environment:
      # Merge host process env into Worker dev bindings so host-exported
      # vars reach `pnpm --filter ucmc-web dev` through the
      # @cloudflare/vite-plugin. Host values win over apps/ucmc-web/.env*.
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
      # Host-shell passthroughs for local Worker secrets. `${VAR:-}` means
      # "empty if unset on host" — apps/ucmc-web/.env.local then fills in.
      SESSION_SECRET: "${SESSION_SECRET:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
    # Published here rather than listed in devcontainer.json's `forwardPorts`.
    # Forwarding is a devcontainer CLIENT feature: it only works while a
    # VS Code window is attached, and Zed (the primary IDE here) and a
    # headless `devcontainer up` do not implement it. Publishing reaches the
    # host in every case, which is why the mailpit sidecar below already does
    # it. Published ports require the server to bind 0.0.0.0, and every one
    # of these does — Vite `server.host: true`, Storybook `--host 0.0.0.0`,
    # and `vite preview`, which resolves `preview.host ?? server.host`.
    #
    # Do NOT also list these in `forwardPorts`: VS Code then finds the host
    # port already taken and silently remaps to a random one, which presents
    # as "port forwarding is broken".
    # https://github.com/microsoft/vscode-remote-release/issues/3025
    ports:
      - "3000:3000" # Vite dev server
      - "4173:4173" # vite preview — the built worker through workerd
      - "6006:6006" # Storybook
      - "9323:9323" # Playwright UI mode + `playwright show-report`
    volumes:
      - ..:/workspace:cached
      # node_modules on a named (container-native) volume rather than the
      # virtiofs bind mount. Bulk metadata on the bind mount is ~90x slower
      # (72k files: `find` is ~1.5s vs ~17ms), which taxes every install,
      # tsc, vitest, and esbuild run. pnpm's store lives INSIDE this volume
      # (`storeDir: node_modules/.store` in pnpm-workspace.yaml) so its
      # hardlinks stay on one filesystem. Source stays bind-mounted, so it
      # remains host-visible; node_modules does not. Adopted from the
      # www.spencerwill.com devcontainer.
      - node-modules:/workspace/node_modules
      - pulumi-config:/home/vscode/.pulumi
      # Bind-mount host's gh auth so the container inherits `gh auth login`
      # from the host. Requires the token to live in ~/.config/gh/hosts.yml
      # (Linux/WSL default; on macOS run `gh auth login --insecure-storage`
      # on the host once, since Keychain-stored tokens don't cross the mount).
      - ${HOME}/.config/gh:/home/vscode/.config/gh:cached
      - claude-data:/home/vscode/.claude
      - command-history:/commandhistory
      - playwright-browsers:/home/vscode/.cache/ms-playwright
    command: sleep infinity
    depends_on:
      - mailpit

  # Mailpit catches outbound dev email so magic links land in a real
  # inbox UI instead of the wrangler terminal. It has two addresses and both
  # are correct, from their own side: http://localhost:8025 from a host
  # browser (via the published ports below), and http://mailpit:8025 from
  # inside the devcontainer, where compose DNS resolves the service name.
  # Code and tests running in the container want the latter.
  # The web app POSTs messages to Mailpit's HTTP send API
  # (`POST /api/v1/send`) when MAILPIT_URL is set; see
  # apps/ucmc-web/src/server/email/resend.ts. The SMTP listener on 1025 is
  # unused today but exposed for future tooling that speaks SMTP.
  # Playwright e2e tests poll Mailpit's REST API to retrieve magic-link
  # tokens during sign-in flows.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI + REST API
      - "1025:1025" # SMTP intake
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      # Bound the inbox so a long-running container can't grow without
      # limit. Tests clear via DELETE /api/v1/messages anyway.
      MP_MAX_MESSAGES: "500"
    volumes:
      - mailpit-data:/data

volumes:
  node-modules:
  pulumi-config:
  claude-data:
  command-history:
  playwright-browsers:
  mailpit-data:
