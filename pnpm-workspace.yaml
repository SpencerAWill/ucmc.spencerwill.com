packages:
  - "apps/ucmc-web"
  - "infra"

# Keep pnpm's content-addressable store INSIDE node_modules so it shares a
# filesystem with the packages it hardlinks into. node_modules is a
# container-native named volume (see .devcontainer/docker-compose.yml), so
# this puts both the store and the linked tree on fast storage while
# preserving hardlinks. A store on a different filesystem would force pnpm
# to COPY instead of hardlink — slower and ~2x the disk. Relative, so it
# resolves to <workspace>/node_modules/.store. Must live here, not .npmrc:
# pnpm 11 no longer reads pnpm settings from .npmrc.
storeDir: node_modules/.store

# Quarantine window for newly published versions — refuses to install
# anything released in the last 7 days. The primary supply-chain
# defense: catches publish-compromise incidents (e.g. the TanStack
# `latest`-tag hijack) before they land in our tree. All deps are
# pinned to specific versions (no `latest`) so this is reachable.
minimumReleaseAge: 10080

# Lifecycle-script allowlist. pnpm 11 renamed `onlyBuiltDependencies`
# (array) to `allowBuilds` (map of package → allow/deny) — see
# https://pnpm.io/settings#allowbuilds. pnpm records the resolved
# decisions in node_modules/.modules.yaml so it's easy to audit.
# Only these packages may run pre/post-install scripts; everything
# else has its lifecycle scripts blocked. lightningcss's published
# package.json looks scriptless, but pnpm 11.1.2 still flags it on
# `pnpm install` as needing approval — leave it in.
allowBuilds:
  "@pulumi/command": true
  esbuild: true
  lightningcss: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Security overrides. pnpm 11 requires these in pnpm-workspace.yaml
# (the `package.json` location stopped being read). Pin transitive
# versions above the known-bad range for each CVE. Every target below has
# already cleared the 7-day `minimumReleaseAge` window, so NONE needs a
# quarantine exception (`minimumReleaseAgeExclude`) — we never bypass the
# supply-chain delay. Nearly all of these advisories live in dev/build
# tooling; none reaches the deployed Worker, but we patch what has a mature fix:
#   - @babel/core <7.29.6  GHSA-4x5r-pxfx-6jf8 (arbitrary file read via sourceMappingURL; via the
#               TanStack build plugins). Babel jumped 7.29.0 -> 7.29.6, so this is a same-minor patch —
#               capped <8 to avoid the unrelated 8.x major.
#   - @grpc/grpc-js <1.14.5  GHSA-5375-pq7m-f5r2 / -99f4-grh7-6pcq (malformed-request DoS; via Pulumi)
#   - @sigstore/core <3.2.1  GHSA-jfc7-64v2-mr8c (DSSE payloadType type-binding confusion)
#   - @sigstore/verify =3.1.0  GHSA-xgjw-pm74-86q4 (signature-verification bypass; via Pulumi's sigstore).
#               3.1.1 is the same-minor patch; capped <4 to stay on the line sigstore 4.1.x pins.
#   - brace-expansion  1.x <1.1.21 + 3.x/4.x/5.x <5.0.12  GHSA-3jxr-9vmj-r5cp / -mh99-v99m-4gvg /
#               -rgw5-rvv9-x895 (ReDoS). Two selectors: the 1.x line (via legacy minimatch) lands on
#               1.1.21; the 3.x–5.x line (the maintainer folds all its fixes into 5.x) lands on 5.0.12.
#   - esbuild   <0.28.1  GHSA-g7r4-m6w7-qqqr (dev-server file read; supersedes the old <0.25.0 CORS pin)
#   - fast-uri  <3.1.5   GHSA-7p8r-x3mc-p8w7 + -v2hh-gcrm-f6hx + -4c8g-83qw-93j6 (ReDoS); capped <4.
#   - ip-address <10.7.1 GHSA-mwp4-54f8-5fhr + -4xrf-jv44-h6hh + -22jq-vg5j-6vgg (ReDoS)
#   - js-yaml   3.x <3.15.1 + 4.x <4.3.1  GHSA-5p4m-2wfm-xmqj / -52cp-r559-cp3m (merge-key + anchor
#               quadratic DoS). Two selectors: Pulumi's 3.14.2 lands on the backported 3.15.1 (the
#               advisory's long-missing 3.15.x line finally shipped 2026-06/07); the 4.x line lands on 4.3.1.
#   - launch-editor <2.14.1  GHSA-v6wh-96g9-6wx3 (NTLMv2 hash disclosure via UNC path)
#   - linkify-it <5.0.2  GHSA-v245-v573-v5vm + -22p9-wv53-3rq4 (quadratic scan-loop DoS; markdown-it dep)
#   - markdown-it <14.3.1  GHSA-6v5v-wf23-fmfq (smartquotes quadratic DoS) + GHSA-2jhp-r4pp-83w6
#               (linkifier backtracking DoS); via tiptap-markdown. Capped <15: the fix is backported to
#               the 14.x line, and tiptap-markdown declares markdown-it ^14.
#   - nanoid   3.x <3.3.18 + 5.x <5.1.16  GHSA-2v37-7h3g-55p8 + -28wg-ghj8-5hjv (predictable IDs /
#               modulo bias). Two selectors — postcss pulls the 3.x line, other tooling the 5.x line.
#   - postcss  <8.5.23  GHSA-r28c-9q8g-f849 (line-return parsing) + -fxqj-rqcc-2cmp; capped <9.
#   - prosemirror-view <1.42.3  GHSA-c8x8-7fp4-3x9w (XSS in paste handling). This one DOES reach the
#               browser — tiptap's editor is prosemirror-view. pnpm resolved two copies (1.41.8 and
#               1.42.3); the override collapses both onto the patched line.
#   - protobufjs <8.6.6  GHSA-j3f2-48v5-ccww (prototype pollution) + the earlier -jggg/-wcpc/-94rc/-f38q set
#   - seroval  <1.6.3  GHSA-p6vx-979v-rg4c (thenable assimilation invokes plugin-produced callables)
#               + GHSA-jp82-f5mq-hwhp (memory exhaustion via unchecked TypedArray length). This is the
#               SSR serializer TanStack Start streams through, so it is on the request path; capped <2.
#   - sharp    <0.35.5  GHSA-f88m-g3jw-g9cj (heap overflow in bundled libvips) + GHSA-wq5f-xc86-pv6w
#               (CVE-2026-96889 in the bundled librsvg); build-time image dep.
#   - shell-quote <1.11.0  GHSA-395f-4hp3-45gv (command injection; 1.8.5 was never published, so 1.9.0
#               was the first release carrying that patch) + GHSA-pqg4-j6r4-53mv (quote() injection via a
#               line terminator after a `{ comment }` token), which 1.9.0 does NOT cover — hence 1.11.0.
#   - sigstore <4.1.1  GHSA-52v5-jr5w-gjxr (verification bypass; via Pulumi); capped <5.
#   - smol-toml <1.9.0  GHSA-r4xh-jqrq-34v2 (quadratic parse() — parseKey rescans to end of document
#               on each key line); via wrangler's config loader.
#   - tar       <7.5.21  GHSA-r292-9mhp-454m (uncatchable stack-overflow DoS) + -23hp-3jrh-7fpw (critical)
#               + the earlier <7.5.16 PAX-override issue
#   - undici    <7.29.1  multiple (TLS cert-validation bypass, cross-origin request routing, header
#               injection, Set-Cookie SameSite downgrade, response-queue poisoning, WebSocket DoS);
#               reaches us only via Cloudflare dev tooling. Capped <8 to stay on the major miniflare
#               and wrangler expect (the tooling versions that bundle 7.29.0 natively are still fresh).
#   - ws        <8.21.0  GHSA-96hv-2xvq-fx4p (memory-exhaustion DoS; via miniflare. Supersedes <8.20.1)
# Three open advisories are deliberately NOT overridden, because no installable fix exists:
#   - braces <=3.0.3  GHSA-vfj7-8cjw-p6xm (stack exhaustion on deeply nested patterns). 3.0.3 IS the
#               latest release; there is no patched version to pin to. Reached only via chokidar/
#               micromatch in dev watch tooling, over developer-authored glob patterns.
#   - http-cache-semantics <=4.2.0  GHSA-ch52-4w7c-c8xp (max-stale can disclose cross-user cached
#               responses). GitHub lists no patched version; 4.3.0 shipped 2026-10-04 but is still
#               inside the quarantine window. Revisit once GitHub confirms 4.3.0 as the fix.
#   - source-map-js <1.2.2  GHSA-68fv-2mgg-jv7q (event-loop DoS via indexed source-map section
#               offsets). 1.2.2 is the fix but shipped 2026-09-30 — it clears the 7-day quarantine on
#               2026-10-07. Pin it then; we do not grant a minimumReleaseAgeExclude for it.
# The @opentelemetry/* set (GHSA-8988-4f7v-96qf core, GHSA-45rx-2jwx-cxfr propagator-jaeger) is fixed
# only on the OTel 2.x line — the whole graph must move majors in lockstep. Rather than force a
# mismatched OTel major onto old Pulumi, we bump @pulumi/pulumi itself: 3.252.0+ migrated its entire
# OTel dependency set to 2.9.x, so pinning every Pulumi copy (ours + the ones @pulumi/cloudflare and
# @pulumi/command nest) to >=3.252.0 pulls the patched OTel 2.x graph and drops the vulnerable 0.57.x
# exporter set. Providers declare @pulumi/pulumi ^3.142.0, so any 3.x runtime is supported. The
# resolver lands on the newest 3.x that has cleared the 7-day quarantine.
# NOT a security override: `prosemirror-model` is deduplicated, not patched.
# `@tiptap/pm` requires ^1.25.11 while every sibling ProseMirror package
# requires only ^1.25.8 / ^1.25.0 / ^1.21.0 / ^1.0.0, so the resolver kept
# 1.25.9 for them and 1.25.11 for @tiptap/pm. Two copies in one bundle makes
# ProseMirror's `instanceof` checks fail across the boundary, and Tiptap says
# so at runtime: "prosemirror-model is loaded more than once. Wrapping and
# splitting nodes will fail." Every declared range is satisfied by 1.25.11,
# so pinning the floor collapses them to one copy. Caught in the E2E server
# log, not by a test — nothing asserts on console warnings.
overrides:
  "@babel/core@<7.29.6": ">=7.29.6 <8.0.0"
  "@grpc/grpc-js@<1.14.5": ">=1.14.5"
  "@pulumi/pulumi@<3.252.0": ">=3.252.0"
  "@sigstore/core@<3.2.1": ">=3.2.1 <4.0.0"
  "@sigstore/verify@3.1.0": ">=3.1.1 <4.0.0"
  "baseline-browser-mapping@<2.11.0": ">=2.11.0 <3.0.0"
  "brace-expansion@<1.1.21": ">=1.1.21 <2.0.0"
  "brace-expansion@>=3.0.0 <5.0.12": ">=5.0.12 <6.0.0"
  "browserslist@<4.28.7": ">=4.28.7 <5.0.0"
  "esbuild@<0.28.1": ">=0.28.1"
  "fast-uri@<3.1.6": ">=3.1.6 <4.0.0"
  "ip-address@<10.7.1": ">=10.7.1"
  "js-yaml@>=3.0.0 <3.15.1": ">=3.15.1 <4.0.0"
  "js-yaml@>=4.0.0 <4.3.2": ">=4.3.2 <5.0.0"
  "launch-editor@<2.14.1": ">=2.14.1"
  "linkify-it@<5.0.2": ">=5.0.2 <6.0.0"
  "markdown-it@<14.3.1": ">=14.3.1 <15.0.0"
  "nanoid@<3.3.18": ">=3.3.18 <4.0.0"
  "nanoid@>=4.0.0 <5.1.16": ">=5.1.16 <6.0.0"
  "pacote@<21.5.1": ">=21.5.1 <22.0.0"
  "postcss@<8.5.23": ">=8.5.23 <9.0.0"
  "postcss-selector-parser@<7.1.3": ">=7.1.3 <8.0.0"
  "prosemirror-model@<1.25.11": ">=1.25.11 <2.0.0"
  "prosemirror-view@<1.42.3": ">=1.42.3 <2.0.0"
  "protobufjs@<8.6.6": ">=8.6.6"
  "seroval@<1.6.3": ">=1.6.3 <2.0.0"
  "sharp@<0.35.5": ">=0.35.5"
  "shell-quote@<1.11.0": ">=1.11.0 <2.0.0"
  "sigstore@<4.1.1": ">=4.1.1 <5.0.0"
  "smol-toml@<1.9.0": ">=1.9.0 <2.0.0"
  "tar@<7.5.21": ">=7.5.21"
  "tmp@<0.2.6": ">=0.2.6"
  "undici@<7.29.1": ">=7.29.1 <8.0.0"
  "ws@<8.21.0": ">=8.21.0"
  # Pin @tanstack/query-core to match our pinned react-query so the
  # auto-installed peer dep stays in lockstep (otherwise pnpm picks
  # the latest matching version, which can be quarantined).
  "@tanstack/query-core": "5.101.1"

peerDependencyRules:
  allowedVersions:
    "eslint-plugin-jsx-a11y>eslint": "10"
    "tiptap-markdown>@tiptap/core": "3"

# `pnpm audit --audit-level high --prod` runs in CI (the `Audit` job). The two
# dated entries below are TIME-BOXED: both advisories have a real fix that is
# simply still inside our 7-day `minimumReleaseAge` quarantine, so we suppress
# the finding rather than bypass the supply-chain delay. DELETE each entry in
# the same change that adds its override — they are not permanent exemptions,
# and leaving one behind blinds the audit to the next advisory on that package.
auditConfig:
  ignoreGhsas:
    - GHSA-rmmr-r34h-pfm5
    # source-map-js GHSA-68fv-2mgg-jv7q (event-loop DoS via indexed source-map
    # section offsets). Fixed in 1.2.2, published 2026-09-30 — clears quarantine
    # 2026-10-07. Pin `source-map-js@<1.2.2` and drop this line on/after then.
    - GHSA-68fv-2mgg-jv7q
    # http-cache-semantics GHSA-ch52-4w7c-c8xp (max-stale can disclose cross-user
    # cached responses). The advisory claims 4.2.1 but no such version was ever
    # published; 4.3.0 (2026-10-04) is the real fix and clears quarantine
    # 2026-10-11. Reached only via Pulumi's bundled npm/arborist tree. Pin
    # `http-cache-semantics@<4.3.0` and drop this line on/after then.
    - GHSA-ch52-4w7c-c8xp
